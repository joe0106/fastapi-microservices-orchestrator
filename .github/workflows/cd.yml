name: CD on Digital Ocean self-hosted runner

on:
  workflow_run:
    workflows: ["CI on Digital Ocean self-hosted runner"]
    types: [completed]
    branches: [main]
  workflow_dispatch: 

jobs:
  deploy-on-ci-success:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug Info
        run: |
          echo "Running on:"
          hostname
          whoami

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker buildx initialize
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy Docker compose
        run: |
          export IMAGE_REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker image prune -f
          docker compose pull
          docker compose up -d --remove-orphans

      - name: Clean up local image
        if: always()
        run: docker image prune -f