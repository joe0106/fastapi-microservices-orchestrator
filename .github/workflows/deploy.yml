name: Deploy on Digital Ocean self-hosted runner

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'src/ApiGateway/**'
      - 'src/InventoryService/**'
      - 'src/OrderService/**'
      - 'src/ShippingService/**'
jobs:
  deploy:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: api-gateway
            directory: ApiGateway
          - service: order-service
            directory: OrderService
          - service: inventory-service
            directory: InventoryService
          - service: shipping-service
            directory: ShippingService
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Debug Info
        run: |
          echo "Running on:"
          hostname
          whoami

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker buildx initialize
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/${{ matrix.directory }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
