name: Deploy on Digital Ocean self-hosted runner

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
jobs:
  deploy:
    runs-on: self-hosted
    strategy:
      matrix:
        service: [api-gateway, order-service, inventory-service, shipping-service]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Debug Info
        run: |
          echo "Running on:"
          hostname
          whoami
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker Image
        uses: docker/build-push-actions@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
