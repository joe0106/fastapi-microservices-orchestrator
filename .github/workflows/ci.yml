name: CI on Digital Ocean self-hosted runner 

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ci.yml'
      - 'src/**'
  workflow_dispatch:
  
jobs:
  deploy:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    strategy:
      max-parallel: 1
      matrix:
        include:
          - service: api-gateway
            directory: ApiGateway
          - service: order-service
            directory: OrderService
          - service: inventory-service
            directory: InventoryService
          - service: shipping-service
            directory: ShippingService

    steps:
      - name: Debug Info
        run: |
          echo "Running on:"
          hostname
          whoami

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: |
          cd src/${{ matrix.directory }}
          ruff check --output-format=github .

      - name: Prepare Image Metadata
        id: meta
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_path=ghcr.io/${REPO}/${{ matrix.service }}" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker buildx initialize
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./src/${{ matrix.directory }}
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}